name: Build EyeNav APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build APK
        run: gradle assembleDebug

      - name: Sign APK with persistent EyeNav key
        shell: bash
        env:
          EYENAV_KEYSTORE_B64: REPLACE_WITH_PERSISTENT_KEY
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          KEYSTORE="$RUNNER_TEMP/eyenav-release.jks"
          ALIGNED="$RUNNER_TEMP/app-debug-aligned.apk"

          printf '%s' "$EYENAV_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"

          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" "$ALIGNED"
          mv "$ALIGNED" "$APK"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass pass:eyenav2026 \
            --key-pass pass:eyenav2026 \
            --alias eyenav \
            --out "$APK" \
            "$APK"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          echo "Signed APK: $APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EyeNav-debug
          path: app/build/outputs/apk/debug/app-debug.apk
